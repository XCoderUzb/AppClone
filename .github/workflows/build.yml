      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Xato xulosasi
        if: failure()
        shell: bash
        run: grep -n -B1 -A6 -E "^e: |What went wrong|AAPT|requires libraries|Could not" build.log | head -80
